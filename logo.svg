<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 280 64" width="280" height="64">
  <title>WSCprep — Canadian Hydrometric Analysis</title>
  <defs>
    <style>
      .wsc-mark-bg   { fill: #0F2E5C; }
      .wsc-grid      { stroke: #FFFFFF; stroke-opacity: 0.06; stroke-width: 0.6; fill: none; }
      .wsc-baseline  { stroke: #007A8A; stroke-width: 1.4; stroke-linecap: round; fill: none; stroke-opacity: 0.9; }
      .wsc-trace-sec { stroke: #007A8A; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-opacity: 0.75; }
      .wsc-trace     { stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wsc-peak-ring { fill: #00A3B8; }
      .wsc-peak-dot  { fill: #FFFFFF; }
      .wsc-sep       { fill: #007A8A; opacity: 0.45; }
    </style>
  </defs>

  <!-- ── MARK ── -->
  <rect width="64" height="64" rx="13" class="wsc-mark-bg"/>
  <line x1="10" y1="22" x2="54" y2="22" class="wsc-grid"/>
  <line x1="10" y1="36" x2="54" y2="36" class="wsc-grid"/>
  <path d="M 10,50 L 54,50"        class="wsc-baseline"/>
  <path d="M 10,48 C 15,48 20,44 26,38 C 30,34 33,31 36,30 C 40,29 44,35 50,44 C 52,46 53,48 54,48"  class="wsc-trace-sec"/>
  <path d="M 10,44 C 13,44 16,28 21,18 C 25,9 28,9 31,10 C 34,11 38,16 44,28 C 48,36 51,42 54,44" class="wsc-trace"/>
  <circle cx="31" cy="10" r="2.6" class="wsc-peak-ring"/>
  <circle cx="31" cy="10" r="1.2"  class="wsc-peak-dot"/>

  <!-- ── WORDMARK ── -->
  <g font-family="'Instrument Sans','Inter','-apple-system','BlinkMacSystemFont','Segoe UI',sans-serif">
    <text x="80"  y="43" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#0F2E5C">WSC</text>
    <text x="155" y="43" font-size="30" font-weight="400" letter-spacing="-0.4" fill="#007A8A">prep</text>
  </g>
  <circle cx="149" cy="40" r="1.8" class="wsc-sep"/>
</svg>