services:
  - type: web
    name: wscprep
    runtime: python
    buildCommand: pip3 install --break-system-packages -r requirements.txt
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ALLOWED_ORIGINS
        value: https://ws-cprep.vercel.app
